# Render Blueprint – one-click hosting for the Expense Tracker.
# Creates a Docker web service (Express API + built React SPA) and a free PostgreSQL database.
services:
  - type: web
    name: expense-tracker
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: '4000'
      # Set to the public https URL of this service (used for CORS + cookie origin).
      - key: CLIENT_URL
        sync: false
      - key: JWT_ACCESS_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: ADMIN_EMAIL
        value: admin@expense-tracker.app
      - key: ADMIN_PASSWORD
        generateValue: true
      - key: SEED_DEMO
        value: 'true'
      - key: DATABASE_URL
        fromDatabase:
          name: expense-tracker-db
          property: connectionString

databases:
  - name: expense-tracker-db
    plan: free
    databaseName: expense_tracker
    user: expense_tracker
